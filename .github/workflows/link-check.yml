name: Link Check

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly, catches external links that died
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --accept 200,201,202,203,204,206,301,302,303,307,308,403,429,999
            --exclude-path experience/_template_.md
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
